<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- IEEE Diamond Kite Emblem with Blockchain Node Fusion -->
  <g transform="translate(4, 4)">
    <!-- Outer Diamond -->
    <polygon points="36,4 68,36 36,68 4,36" fill="#002855" />
    <polygon points="36,9 63,36 36,63 9,36" fill="#00629B" />
    
    <!-- Blockchain Interconnected Circuit Nodes inside Diamond -->
    <circle cx="36" cy="22" r="4.5" fill="#00E5FF" />
    <circle cx="22" cy="36" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="36" r="4.5" fill="#FFFFFF" />
    <circle cx="36" cy="50" r="4.5" fill="#00E5FF" />
    
    <!-- Connecting Vector Lines (Distributed Ledger Links) -->
    <line x1="36" y1="22" x2="22" y2="36" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="36" y1="22" x2="50" y2="36" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="22" y1="36" x2="36" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="50" y1="36" x2="36" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    <line x1="22" y1="36" x2="50" y2="36" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="2,2" />
    
    <!-- Central Consensus Core -->
    <circle cx="36" cy="36" r="3.2" fill="#002855" stroke="#00E5FF" stroke-width="1.5" />
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="84" y1="12" x2="84" y2="64" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" />

  <!-- Typography Lockup -->
  <g transform="translate(96, 0)">
    <!-- Master Brand IEEE -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="900" font-size="26" fill="#002855" letter-spacing="-0.03em">IEEE</text>
    
    <!-- Blockchain Designation -->
    <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="700" font-size="20" fill="#00629B" letter-spacing="0.02em">BLOCKCHAIN</text>
    
    <!-- Pune Section Sub-Brand -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="12.5" fill="#008B8B" letter-spacing="0.16em">PUNE SECTION</text>
    
    <!-- Affiliation Subtitle -->
    <text x="0" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="9" fill="#6B7280" letter-spacing="0.04em">Region 10 (Asia-Pacific) &bull; Technical Community</text>
  </g>
</svg>
